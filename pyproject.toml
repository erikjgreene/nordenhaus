[project]
name = "nordenhaus-data-extractor"
version = "0.1.0"
description = "Direct Airbnb listing and reviews extractor (no images) for Norden Haus website build"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
apify = [
    "apify-client>=1.6.0",
]

[project.scripts]
scrape = "scripts.scrape_airbnb_direct:main"
scrape-apify = "scripts.scrape_airbnb_data:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false
